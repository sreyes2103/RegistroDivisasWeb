<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Divisas</title>
    <!-- Conectamos el archivo de diseño -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Control de Divisas y Deudas</h1>
        
        <!-- Formulario para ingresar nuevos datos -->
        <form id="formulario">
            <label for="contacto">Contacto:</label>
            <input type="text" id="contacto" placeholder="Ej. Proveedor Refri Pharma" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" placeholder="0414-1234567" required>

            <label for="monto">Monto (Divisas):</label>
            <input type="number" id="monto" placeholder="Ej. 150.00" step="0.01" required>

            <label for="estado">Estado:</label>
            <select id="estado">
                <option value="Me debe">Me debe</option>
                <option value="Pagado">Pagado</option>
                <option value="Por cobrar">Por cobrar</option>
            </select>

            <button type="submit">Guardar Registro</button>
        </form>

        <hr>

        <h2>Historial de Registros</h2>
        <!-- Aquí aparecerán los registros guardados más adelante -->
        <div id="lista-registros">
            <p>No hay registros todavía.</p>
        </div>
    </div>

    <!-- Conectamos el archivo de programación -->
    <script src="app.js"></script>
</body>
</html>
